<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter & Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>QuickNotes Editor</h1>
            <button id="theme-toggle">Dark Mode</button>
        </header>

        <main>
            <label for="note-text">Write your note:</label>
            <textarea id="note-text" placeholder="Start typing here..."></textarea>
            
            <div class="stats">
                <p id="char-count">0 / 200 characters</p>
                <p id="word-count">0 words</p>
            </div>

            <button id="clear-btn">Clear Text</button>
        </main>
    </div>
</body>
</html>
